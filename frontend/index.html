<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d9488">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2316a34a'/%3E%3Cstop offset='0.5' stop-color='%230d9488'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M7 11h18v3.5a2.5 2.5 0 0 0 0 5V23H7v-3.5a2.5 2.5 0 0 0 0-5z' fill='%23ffffff'/%3E%3Cpath d='M20 12v2M20 15v2M20 18v2' stroke='%230d9488' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2316a34a'/%3E%3Cstop offset='0.5' stop-color='%230d9488'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M7 11h18v3.5a2.5 2.5 0 0 0 0 5V23H7v-3.5a2.5 2.5 0 0 0 0-5z' fill='%23ffffff'/%3E%3Cpath d='M20 12v2M20 15v2M20 18v2' stroke='%230d9488' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>IT Ticket Classifier</title>
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("ticket-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        try { theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
        catch (e) { theme = "light"; }
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --radius: 16px;
      --gradient: linear-gradient(100deg, #16a34a 0%, #0d9488 50%, #7c3aed 100%);
      --grid-size: 36px;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #fbfbfc; --card: #ffffff; --soft: #f4f6fa;
      --border: #e3e7ee; --border-strong: #cfd5e0;
      --text: #0f1420; --muted: #667085;
      --accent: #0d9488;
      --high: #b91c1c; --medium: #b45309; --low: #15803d;
      --grid-line: rgba(16, 24, 40, 0.045);
      --shadow: 0 1px 2px rgba(16,24,40,.05), 0 14px 34px rgba(16,24,40,.08);
      --shadow-lift: 0 2px 4px rgba(16,24,40,.06), 0 24px 48px rgba(13,148,136,.16);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0f14; --card: #12171f; --soft: #171e28;
      --border: #232b36; --border-strong: #323d4b;
      --text: #e8edf4; --muted: #93a1b3;
      --accent: #2dd4bf;
      --high: #f87171; --medium: #fbbf24; --low: #4ade80;
      --grid-line: rgba(255, 255, 255, 0.035);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 36px rgba(0,0,0,.45);
      --shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 26px 52px rgba(45,212,191,.14);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font: 16px/1.55 var(--sans);
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
      -webkit-font-smoothing: antialiased;
      transition: background-color .2s ease, color .2s ease;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
      perspective: 1400px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .icon-btn {
      width: 42px; height: 42px;
      display: inline-grid; place-items: center;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .icon-btn:hover { transform: translateY(-2px) rotateX(8deg); border-color: var(--border-strong); box-shadow: var(--shadow); }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-sun { display: none; }
    html[data-theme="dark"] .icon-sun { display: block; }
    html[data-theme="dark"] .icon-moon { display: none; }

    /* 3D tilt surface */
    .tilt {
      --rx: 0deg; --ry: 0deg;
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.4rem;
      margin-bottom: 1.25rem;
      transform-style: preserve-3d;
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      transition: transform .25s ease-out, box-shadow .25s ease-out;
      will-change: transform;
    }
    .tilt.is-active { box-shadow: var(--shadow-lift); transition: transform .06s linear, box-shadow .25s ease-out; }
    .depth { transform: translateZ(26px); }
    .depth-sm { transform: translateZ(14px); }

    label { font-size: .95rem; font-weight: 600; }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      margin-top: .6rem;
      padding: .9rem 1rem;
      resize: vertical;
      font: .95rem/1.5 var(--mono);
      color: var(--text);
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: border-color .15s ease, box-shadow .2s ease;
    }
    textarea::placeholder { color: var(--muted); opacity: .75; }
    textarea:hover { border-color: var(--border-strong); }
    textarea:focus-visible {
      outline: 2px solid transparent;
      border-color: #0d9488;
      box-shadow:
        0 0 0 2px rgba(22,163,74,.40),
        0 0 0 5px rgba(13,148,136,.26),
        0 0 0 8px rgba(124,58,237,.14);
    }

    .row { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-top: .6rem; }
    .counter { font: .76rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

    .examples { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
    .chip {
      padding: .4rem .8rem;
      font: .78rem var(--mono);
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: transform .18s ease, color .18s ease, border-color .18s ease;
    }
    .chip:hover { transform: translateY(-2px) translateZ(8px); color: var(--text); border-color: var(--accent); }

    .primary {
      margin-top: 1.1rem;
      min-height: 46px;
      padding: .65rem 1.6rem;
      font: 600 1rem var(--sans);
      color: #fff;
      background: #0d9488;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .18s ease, background-color .18s ease;
    }
    html[data-theme="dark"] .primary { background: #14b8a6; color: #04201d; }
    .primary:hover:not(:disabled) { transform: translateY(-2px); background: #0f766e; }
    html[data-theme="dark"] .primary:hover:not(:disabled) { background: #2dd4bf; }
    .primary:active:not(:disabled) { transform: translateY(0); }
    .primary:disabled { opacity: .5; cursor: progress; }
    .primary:focus-visible, .chip:focus-visible, .icon-btn:focus-visible {
      outline: 2px solid transparent;
      box-shadow: 0 0 0 2px rgba(22,163,74,.5), 0 0 0 5px rgba(124,58,237,.3);
    }

    .error {
      min-height: 1.4rem;
      margin-top: .8rem;
      font: .82rem var(--mono);
      color: var(--high);
    }

    /* Result */
    #result:not([hidden]) { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; transform-origin: 50% 0; }
    @keyframes rise {
      from { opacity: 0; transform: rotateX(-14deg) translateY(18px); }
      to   { opacity: 1; transform: rotateX(var(--rx)) rotateY(var(--ry)); }
    }
    .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 1.75rem; }
    .kicker { margin: 0; font: .74rem var(--mono); color: var(--muted); }
    h2 { margin: .15rem 0 .8rem; font-size: 1.6rem; letter-spacing: -.03em; line-height: 1.15; }
    .big {
      margin: 0 0 .5rem;
      font-size: clamp(2rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .bar { height: 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--border); overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0; background: var(--gradient); border-radius: 999px; transition: width .7s cubic-bezier(.23,1,.32,1); }

    .top { list-style: none; margin: 1.1rem 0 0; padding: 0; display: grid; gap: .55rem; }
    .top li { display: grid; grid-template-columns: 1fr auto; gap: .15rem .75rem; font-size: .9rem; }
    .top li .mini { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; }
    .top li .mini span { display: block; height: 100%; background: var(--gradient); opacity: .75; }
    .top .pct { font: .8rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

    .priority {
      display: inline-block;
      padding: .3rem .9rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -.02em;
      border-radius: 12px;
      border: 1px solid currentColor;
    }
    .priority.High   { color: var(--high);   background: color-mix(in srgb, var(--high) 12%, transparent); }
    .priority.Medium { color: var(--medium); background: color-mix(in srgb, var(--medium) 12%, transparent); }
    .priority.Low    { color: var(--low);    background: color-mix(in srgb, var(--low) 12%, transparent); }
    .points { margin: .6rem 0 0; font: .8rem var(--mono); color: var(--muted); }
    .rules { margin: .9rem 0 0; padding: 0; list-style: none; display: grid; gap: .4rem; font-size: .88rem; }
    .rules li { padding: .35rem .65rem; background: var(--soft); border: 1px solid var(--border); border-radius: 8px; }

    footer { font: .74rem/1.6 var(--mono); color: var(--muted); }
    footer p { margin: 0 0 .25rem; }

    @media (max-width: 640px) {
      main { padding: 1.5rem 1rem 3rem; }
      .grid { grid-template-columns: 1fr; gap: 1.5rem; }
      .primary { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
      .tilt { transform: none !important; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>IT Ticket<br>Classifier</h1>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle theme" title="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <section class="tilt" id="form-card">
    <div class="depth-sm">
      <label for="ticket">Ticket</label>
      <textarea id="ticket" maxlength="5000" minlength="5" placeholder="Describe the issue"></textarea>
      <div class="row">
        <span class="counter"><span id="count">0</span>/5000</span>
      </div>
      <div class="examples">
        <button class="chip example" type="button" data-text="Everyone is unable to access the office network; this is urgent.">Network outage</button>
        <button class="chip example" type="button" data-text="My laptop is broken and crashes when I open the finance app.">Laptop crash</button>
        <button class="chip example" type="button" data-text="How do I request access to a shared project folder?">Access request</button>
      </div>
    </div>
    <div class="depth">
      <button class="primary" id="classify" type="button">Classify</button>
      <div class="error" id="error" role="alert"></div>
    </div>
  </section>

  <section class="tilt" id="result" aria-live="polite" hidden>
    <div class="grid">
      <div class="depth-sm">
        <p class="kicker">Category</p>
        <h2 id="category"></h2>
        <p class="big" id="confidence"></p>
        <div class="bar"><span id="confidence-bar"></span></div>
        <ol class="top" id="top"></ol>
      </div>
      <div class="depth">
        <p class="kicker">Priority</p>
        <span class="priority" id="priority"></span>
        <p class="points"><span id="points"></span> points</p>
        <ul class="rules" id="rules"></ul>
      </div>
    </div>
  </section>

  <footer>
    <p>Suggestion only: priority rules matched a reviewer on 58% of 60 tickets.</p>
    <p>Trained on email-style tickets; short sentences may be less reliable.</p>
  </footer>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const ticket = $("#ticket"), count = $("#count"), error = $("#error"), result = $("#result");
  const setCount = () => { count.textContent = ticket.value.length; };
  ticket.addEventListener("input", setCount);

  document.querySelectorAll(".example").forEach((b) => {
    b.addEventListener("click", () => { ticket.value = b.dataset.text; setCount(); ticket.focus(); });
  });

  $("#theme").addEventListener("click", () => {
    const root = document.documentElement;
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("ticket-theme", next); } catch (e) {}
  });

  // Subtle 3D tilt that follows the pointer (fine pointers only, motion allowed)
  const canTilt = matchMedia("(hover: hover) and (pointer: fine)").matches &&
                  !matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (canTilt) {
    const MAX = 2.5;
    document.querySelectorAll(".tilt").forEach((el) => {
      el.addEventListener("pointermove", (e) => {
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        el.style.setProperty("--ry", (x * MAX * 2).toFixed(2) + "deg");
        el.style.setProperty("--rx", (-y * MAX * 2).toFixed(2) + "deg");
        el.classList.add("is-active");
      });
      el.addEventListener("pointerleave", () => {
        el.style.setProperty("--rx", "0deg");
        el.style.setProperty("--ry", "0deg");
        el.classList.remove("is-active");
      });
    });
  }

  const li = (text) => { const n = document.createElement("li"); n.textContent = text; return n; };

  $("#classify").addEventListener("click", async () => {
    error.textContent = "";
    result.hidden = true;
    if (ticket.value.trim().length < 5) { error.textContent = "Enter at least 5 characters."; return; }
    const button = $("#classify");
    button.disabled = true; button.textContent = "Classifying…";
    try {
      const response = await fetch("/api/v1/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: ticket.value })
      });
      let data = null;
      try { data = await response.json(); } catch (e) {}
      if (!response.ok) {
        const d = data && data.detail;
        throw new Error(typeof d === "string" ? d : "Could not classify this ticket.");
      }

      $("#category").textContent = data.category;
      const conf = (data.category_confidence * 100).toFixed(1);
      $("#confidence").textContent = conf + "%";

      const top = $("#top");
      top.replaceChildren();
      data.top_categories.forEach((item) => {
        const p = (item.probability * 100).toFixed(1);
        const row = document.createElement("li");
        const name = document.createElement("span"); name.textContent = item.category;
        const pct = document.createElement("span"); pct.className = "pct"; pct.textContent = p + "%";
        const mini = document.createElement("div"); mini.className = "mini";
        const fill = document.createElement("span"); fill.style.width = p + "%";
        mini.appendChild(fill);
        row.append(name, pct, mini);
        top.appendChild(row);
      });

      const priority = $("#priority");
      priority.textContent = data.priority;
      priority.className = "priority " + data.priority;
      $("#points").textContent = data.priority_points;

      const rules = $("#rules");
      rules.replaceChildren();
      if (data.priority_rules_matched.length) {
        data.priority_rules_matched.forEach((r) => rules.appendChild(li(r)));
      } else {
        rules.appendChild(li("No urgency rules matched"));
      }

      const bar = $("#confidence-bar");
      bar.style.width = "0";
      result.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = conf + "%"; }));
    } catch (err) {
      error.textContent = err instanceof TypeError ? "Could not reach the API." : err.message;
    } finally {
      button.disabled = false; button.textContent = "Classify";
    }
  });
</script>
</body>
</html>
